# docsite build configuration, loaded by `python -m docsite` (appinfra config spec).

logging:
  level: info
  handlers:
    console:
      type: console
      enabled: true
      format: text
      stream: stderr
      colors: true

site:
  # Package checkouts and the downloaded nav partial
  build_dir: .build/src
  # The site's own pages: home, Get started, How-to guides, Concepts, package landing pages
  pages_dir: pages
  # Zensical docs_dir, rebuilt by every stage: pages_dir, then each package's docs under <name>/
  docs_dir: docs
  # Zensical config: the tracked base, and the generated file Zensical reads
  zensical_base: zensical.base.toml
  zensical_config: zensical.toml

# The header is the main site's nav, fetched live at every build so a nav change on
# www.llm-works.ai needs only a docs rebuild, not a change here.
nav:
  url: https://www.llm-works.ai/partials/nav.html
  # Root-relative links in the nav are rewritten to this origin
  site_origin: https://www.llm-works.ai
  output: overrides/partials/site-nav.html
  timeout_s: 10

# The main site's shared stylesheets, fetched with the nav and loaded before pages/assets/extra.css:
# tokens.css holds the brand's custom properties (--bg, --accent, --mono, ...), which extra.css
# uses instead of copied values; nav.css styles the nav partial and its theme switch.
brand:
  tokens_url: https://www.llm-works.ai/partials/tokens.css
  nav_css_url: https://www.llm-works.ai/partials/nav.css
  timeout_s: 10

# Packages by name. Each is fetched at its git `ref`: a release tag for the published site; for a
# preview, a branch or <branch>@<commit> (pushed), set in a gitignored Makefile.local as
# `serve: export INFRA_PACKAGES_<NAME>_REF := develop@9843ff` (NAME upper-cased, - as _).
# `docs_root` is its docs directory in the repo (default: docs). The package's docs are the source and are published as they are; the
# arrangement is the site's. `docs` is the package's tree in the site nav and its allowlist at
# once: only the files it lists are published, in that order. An entry is a path (titled by the
# page's heading), {Title: path}, or {Section: [entries]}. No wildcards: a new file must be
# listed to ship. `rename` stages a file under another name. `reference` adds an API reference
# generated from the package's docstrings. Each package also needs a landing page,
# pages/<name>/index.md, and an entry {<name>: <name>/index.md} under Packages in
# zensical.base.toml.
packages:
  appinfra:
    repo: https://github.com/llm-works/appinfra.git
    ref: v0.15.0
    docs_root: appinfra/docs
    # Zensical takes a README.md as the folder's index, which is the landing page here
    rename:
      README.md: user-guide.md
      # A plain-text file renamed to .md is published as a page, its text in a code block
      LICENSE: license.md
    # Generated from the docstrings at the ref: one page per package and subpackage of appinfra/
    reference:
      package: appinfra
    # Not listed: index.md, the `appinfra docs` CLI's navigation page (the landing page here is
    # pages/appinfra/index.md)
    docs:
      - User guide: README.md
      - Getting started: getting-started.md
      - Guides:
          - Configuration:
              - guides/configuration-precedence.md
              - guides/environment-variables.md
              - guides/config-protocol.md
              - guides/decorator-config-pattern.md
          - Logging:
              - guides/logging-builder.md
              - guides/config-based-logging.md
              - guides/hot-reload-logging.md
          - Applications:
              - guides/framework-integration.md
              - guides/library-mode-bootstrap.md
              - guides/api-stability.md
          - Testing:
              - guides/pytest-plugin.md
              - guides/pg-test-helper.md
              - guides/test-suites.md
              - guides/test-naming-standards.md
              - guides/coverage-targets.md
          - Development tooling:
              - guides/virtual-environment.md
              - guides/makefile-customization.md
              - guides/spdx-header-check.md
              - guides/contributing.md
      # Hand-written module overviews; the full API reference is generated (see reference)
      - Module guides:
          - api/index.md
          - api/app.md
          - api/app-builder.md
          - api/fastapi.md
          - api/cli.md
          - api/config.md
          - api/logging.md
          - api/ui.md
          - api/database.md
          - api/cas.md
          - api/net.md
          - api/time.md
          - api/version.md
          - api/observability.md
          - api/service.md
          - api/subprocess.md
          - api/utilities.md
          - api/errors.md
      - Security policy: SECURITY.md
      # The docs are published under appinfra's licence (Apache 2.0), which ships with them
      - License: LICENSE
