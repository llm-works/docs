[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-works-docs"
# Never published: the site deploys from main, with no version tags.
version = "0.0.0"
description = "Build scripts and shell for docs.llm-works.ai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "LLM Works LLC", email = "info@llm-works.ai"}
]
classifiers = [
    # PyPI rejects uploads carrying this classifier
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # validation: pydantic, for the build config models
    "appinfra[validation]>=0.14.0",
    # writes the generated zensical.toml
    "tomli-w>=1.2",
    # the site generator; pinned, upgrades are checked against the built site
    "zensical==0.1.2",
    # the generated API reference; mkdocstrings-python brings griffe, which the docstring
    # extension (docsite/docstring_code.py) builds on
    "mkdocstrings==1.0.8",
    "mkdocstrings-python==2.0.10",
    # GitHub-style lists in package docs: no blank line before a list, two-space nesting
    "mdx_breakless_lists==1.0.1",
    "mdx_truly_sane_lists==1.3",
]

[project.optional-dependencies]
dev = [
    # check: ruff, mypy, pytest, pytest-cov, pytest-xdist and the make check tooling
    "appinfra[check]>=0.14.0",
    # the browser smoke test of the built site (tests/e2e); its browser is installed separately
    "pytest-playwright>=0.7",
    # gives pytest-playwright its base_url fixture; without it the plugin's own fallback warns
    # under pytest 9 (session fixture defined as an instance method)
    "pytest-base-url>=2.1",
]

[project.urls]
Homepage = "https://docs.llm-works.ai"
Repository = "https://github.com/llm-works/docs"
Issues = "https://github.com/llm-works/docs/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["docsite*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "FA",     # flake8-future-annotations
    "C90",    # mccabe complexity
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PIE",    # flake8-pie
    "PERF",   # perflint
    "FURB",   # refurb
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# No async tests: keep a pytest-asyncio from a shared environment from loading
addopts = "-p no:asyncio"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
