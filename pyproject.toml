[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-works-docs"
# Never published: the site deploys from main, with no version tags.
version = "0.0.0"
description = "Build scripts and shell for docs.llm-works.ai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "LLM Works LLC", email = "info@llm-works.ai"}
]
classifiers = [
    # PyPI rejects uploads carrying this classifier
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    # check: ruff, mypy, pytest, pytest-cov, pytest-xdist and the make check tooling
    "appinfra[check]>=0.14.0",
]

[project.urls]
Homepage = "https://docs.llm-works.ai"
Repository = "https://github.com/llm-works/docs"
Issues = "https://github.com/llm-works/docs/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["docsite*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "FA",     # flake8-future-annotations
    "C90",    # mccabe complexity
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PIE",    # flake8-pie
    "PERF",   # perflint
    "FURB",   # refurb
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# No async tests: keep a pytest-asyncio from a shared environment from loading
addopts = "-p no:asyncio"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
